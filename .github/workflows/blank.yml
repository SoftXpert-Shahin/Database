on:
  schedule:
    - cron: '0 0 * * *' # Runs every single day at midnight UTC
  workflow_dispatch: # Allows manual execution

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit and push changes back to the repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI & AWS CLI
        run: |
          npm install -g supabase
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install

      - name: Create Backup Directory
        run: mkdir -p backups/database backups/storage

      - name: Back Up Database Schema and Data
        run: |
          supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" -f backups/database/schema.sql
          supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" -f backups/database/data.sql --use-copy --data-only

      - name: Back Up Storage Bucket Files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-1"
        run: |
          aws s3 sync s3://your-bucket-name ./backups/storage --endpoint-url ${{ secrets.SUPABASE_S3_ENDPOINT }}

      - name: Commit and Push Backups to GitHub
        run: |
          git config --global user.name 'Supabase Backup Bot'
          git config --global user.email 'actions@github.com'
          git add backups/
          
          if git diff --staged --quiet; then
            echo "No changes detected in database or storage since last backup."
          else
            git commit -m "Automated Backup: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi

      - name: Install Supabase CLI & AWS CLI
        run: |
          npm install -g supabase
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install

      - name: Create Backup Directory
        run: mkdir -p backups/database backups/storage

      - name: Back Up Database Schema and Data
        run: |
          supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" -f backups/database/schema.sql
          supabase db dump --db-url "${{ secrets.SUPABASE_DB_URL }}" -f backups/database/data.sql --use-copy --data-only

      - name: Back Up Storage Bucket Files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: "us-east-1"
        run: |
          aws s3 sync s3://your-bucket-name ./backups/storage --endpoint-url ${{ secrets.SUPABASE_S3_ENDPOINT }}

      - name: Commit and Push Backups to GitHub
        run: |
          git config --global user.name 'Supabase Backup Bot'
          git config --global user.email 'actions@github.com'
          git add backups/
          
          if git diff --staged --quiet; then
            echo "No changes detected in database or storage since last backup."
          else
            git commit -m "Automated Backup: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
